name: Build Android app (APK)

# Runs on every change to main, or from the Actions tab with "Run workflow".
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Version number: the build number goes into version.js (inside the app) and, after the release, into version.json (the update notice reads it)
      - name: Stamp the version
        run: |
          python3 - <<'PY'
          import json, os
          b = int(os.environ['GITHUB_RUN_NUMBER'])
          v = '1.0.%d' % b
          notes = [l.strip() for l in open('release-notes.txt', encoding='utf-8') if l.strip()]
          open('version.js', 'w').write("// Written by the build workflow (.github/workflows/android.yml). Do not edit by hand.\nwindow.SHK_VERSION = { version: '%s', build: %d };\n" % (v, b))
          json.dump({'version': v, 'build': b, 'notes': notes, 'apk': 'https://github.com/${{ github.repository }}/releases/latest/download/shaker-inspect.apk'}, open('version.json', 'w'), ensure_ascii=False, indent=1)
          PY
          cat version.js version.json

      # The web files go INSIDE the app (a real APK, not a link in a frame).
      - name: Copy the web files into www/
        run: |
          mkdir -p www
          cp -r index.html tracker.html app-api.js app-screens.js app-daily.js app-extras.js app-acc.js app-ui.js app-nav.js app-update.js app.css theme.css config.js version.js manifest.webmanifest sw.js icons www/

      - name: Install Capacitor and create the Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      # Every build needs a HIGHER versionCode than the one before, or Android says "App not installed" on update
      - name: Version code for Android
        run: |
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" $f
          grep -nE "versionCode|versionName" $f

      # Camera for the villa QR scanner (the live camera inside the app)
      - name: Camera permission
        run: |
          m=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $m || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' $m
          grep -n 'permission' $m

      # Push notifications: the Firebase file, kept as a repository secret (Settings > Secrets > Actions > GOOGLE_SERVICES_JSON)
      - name: Firebase file (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "push: on"; else echo "push: no Firebase file yet (the app works, push stays off)"; fi

      - name: App icon
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          im = Image.open('icons/icon-512.png').convert('RGBA')
          for n, s in (('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)):
              d = f'{res}/mipmap-{n}'
              os.makedirs(d, exist_ok=True)
              r = im.resize((s, s), Image.LANCZOS)
              for f in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  r.save(f'{d}/{f}.png')
          PY

      # One fixed signing key, so every new build installs OVER the old one (no uninstall needed).
      - name: Signing key
        run: |
          mkdir -p ~/.android
          cp android-signing/shaker-debug.keystore ~/.android/debug.keystore
          # Tell Gradle to sign with OUR key by path (the old way was ignored: every build got a new random key,
          # which is why Android said "App not installed" on updates).
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file("${GITHUB_WORKSPACE}/android-signing/shaker-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      - name: Build the APK
        working-directory: android
        run: |
          set +e
          # the Gradle download sometimes times out on GitHub's side: try again a few times
          for i in 1 2 3 4 5 6; do ./gradlew --version > /dev/null 2>&1 && break; echo "gradle download failed, retry $i"; sleep 25; done
          ./gradlew assembleDebug --no-daemon > ../build.txt 2>&1
          status=$?
          tail -80 ../build.txt
          if [ $status -ne 0 ]; then
            body=$(grep -E -A6 "error:|Error|What went wrong" ../build.txt | head -120)
            body="${body//'%'/'%25'}"; body="${body//$'\r'/'%0D'}"; body="${body//$'\n'/'%0A'}"
            echo "::error title=Build details::${body}"
            exit $status
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../shaker-inspect.apk

      # Safety check: the APK must carry the key from the repository, or the build fails (never ship an APK that cannot update).
      - name: Check the signing key
        run: |
          want=$(keytool -list -keystore android-signing/shaker-debug.keystore -storepass android 2>/dev/null | grep -o 'SHA-256): [0-9A-F:]*' | cut -d' ' -f2)
          got=$(keytool -printcert -jarfile shaker-inspect.apk | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "repo key: $want"; echo "apk key:  $got"
          [ -n "$want" ] && [ "$want" = "$got" ]

      - name: Publish for download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shaker Inspect - build ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: shaker-inspect.apk
          body: |
            Download shaker-inspect.apk on an Android phone and install it.
            iPhone or laptop: https://architectahmedgaber-sys.github.io/shaker-inspect/

      # Publish the new version number to the web app (GitHub Pages) so open apps can tell an update is ready.
      # Pushed by the workflow itself, so it does not start another build.
      - name: Publish version.json to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.js version.json
          git commit -m "Version ${GITHUB_RUN_NUMBER} [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
