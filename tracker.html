/* Layout: Ptah drill-down — company tiles > type tiles > villa cards > villa BOQ sheet; breadcrumb + big Back; Classic (light) / Command (dark glass) */
:root{
  --primary:#2563eb; --primary-hover:#1d4ed8; --primary-soft:#eff6ff; --primary-line:#bfdbfe;
  --success:#059669; --success-bg:#d1fae5; --danger:#dc2626; --danger-bg:#fee2e2; --warning:#b45309; --warning-bg:#fef3c7;
  --bg:#f8fafc; --bg-glow:none; --card-bg:#ffffff; --inset:#f1f5f9; --text-main:#0f172a; --text-muted:#64748b; --border:#e2e8f0;
  --foot-bg:#0f172a; --foot-ink:#ffffff; --foot-muted:#94a3b8; --on-primary:#ffffff; --shadow:0 1px 3px rgba(0,0,0,.05); --lift:0 24px 44px -20px rgba(0,0,0,.3);
  --sh:#2563eb; --sq:#0d9488; --at:#7c3aed; --idle:#64748b; --blur:none;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --primary:#7c9cff; --primary-hover:#9db4ff; --primary-soft:rgba(124,156,255,.12); --primary-line:rgba(124,156,255,.35);
  --success:#34d399; --success-bg:rgba(52,211,153,.14); --danger:#fb7185; --danger-bg:rgba(251,113,133,.14); --warning:#fbbf24; --warning-bg:rgba(251,191,36,.14);
  --bg:#070b14; --bg-glow:radial-gradient(1100px 560px at 8% -8%, rgba(99,102,241,.28), transparent 60%),radial-gradient(900px 480px at 100% 0%, rgba(20,184,166,.2), transparent 60%),radial-gradient(800px 500px at 50% 120%, rgba(168,85,247,.16), transparent 60%);
  --card-bg:rgba(255,255,255,.05); --inset:rgba(255,255,255,.05); --text-main:#e6edf7; --text-muted:#8b97ad; --border:rgba(255,255,255,.11);
  --foot-bg:rgba(255,255,255,.05); --foot-ink:#ffffff; --foot-muted:#8b97ad; --on-primary:#07101f; --shadow:none; --lift:0 24px 54px -22px rgba(124,156,255,.6);
  --sh:#60a5fa; --sq:#2dd4bf; --at:#a78bfa; --idle:#8b97ad; --blur:blur(12px); color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#7c9cff; --primary-hover:#9db4ff; --primary-soft:rgba(124,156,255,.12); --primary-line:rgba(124,156,255,.35);
  --success:#34d399; --success-bg:rgba(52,211,153,.14); --danger:#fb7185; --danger-bg:rgba(251,113,133,.14); --warning:#fbbf24; --warning-bg:rgba(251,191,36,.14);
  --bg:#070b14; --bg-glow:radial-gradient(1100px 560px at 8% -8%, rgba(99,102,241,.28), transparent 60%),radial-gradient(900px 480px at 100% 0%, rgba(20,184,166,.2), transparent 60%),radial-gradient(800px 500px at 50% 120%, rgba(168,85,247,.16), transparent 60%);
  --card-bg:rgba(255,255,255,.05); --inset:rgba(255,255,255,.05); --text-main:#e6edf7; --text-muted:#8b97ad; --border:rgba(255,255,255,.11);
  --foot-bg:rgba(255,255,255,.05); --foot-ink:#ffffff; --foot-muted:#8b97ad; --on-primary:#07101f; --shadow:none; --lift:0 24px 54px -22px rgba(124,156,255,.6);
  --sh:#60a5fa; --sq:#2dd4bf; --at:#a78bfa; --idle:#8b97ad; --blur:blur(12px); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg-glow),var(--bg);background-attachment:fixed;background-color:var(--bg);color:var(--text-main);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:24px 32px;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
bdi,.ltr{unicode-bidi:isolate;direction:ltr}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.82em}
.wrap{max-width:1400px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.header-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.header-title h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.header-title p{margin:4px 0 0;font-size:14px;color:var(--text-muted);max-width:70ch}
.header-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--inset);border:1px solid var(--border)}
.seg button{border:none;background:transparent;padding:6px 12px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.search-box input{padding:10px 16px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;width:320px;max-width:100%;background:var(--card-bg);backdrop-filter:var(--blur)}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.badge-counter{background:var(--primary-soft);color:var(--primary);padding:8px 16px;border-radius:20px;font-weight:600;font-size:13px;border:1px solid var(--primary-line);display:inline-flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)} .dot.on{background:var(--success)}

.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.crumbs button{border:none;background:transparent;cursor:pointer;font-weight:600;color:var(--primary);padding:7px 12px;border-radius:10px}
.crumbs button:hover{background:var(--primary-soft)}
.crumbs .back-btn{border:1px solid var(--border);background:var(--card-bg);color:var(--text-main);margin-inline-end:8px;font-size:17px;padding:12px 22px;min-height:48px;border-radius:14px;backdrop-filter:var(--blur)}
.crumbs .sep{color:var(--text-muted)} .crumbs .here{font-weight:700;padding:7px 12px}

.stage-in{animation:stageIn .28s ease}
@keyframes stageIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage-in{animation:none}.nav-tile,.card{transition:none!important}}

.nav-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:22px}
.nav-tile{--accent:var(--idle);position:relative;text-align:left;cursor:pointer;background:var(--card-bg);backdrop-filter:var(--blur);border:1px solid var(--border);border-top:8px solid var(--accent);border-radius:22px;padding:24px 24px 18px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:transform .18s ease,box-shadow .18s ease;box-shadow:var(--shadow)}
.nav-tile:hover{transform:translateY(-6px);box-shadow:var(--lift)}
.nav-tile.empty{opacity:.55;cursor:default} .nav-tile.empty:hover{transform:none;box-shadow:var(--shadow)}
.nav-name{font-size:26px;font-weight:800;letter-spacing:-.01em}
.nav-sub{margin-top:6px;font-size:14px;color:var(--text-muted)}
.nav-num{font-size:60px;font-weight:800;line-height:1;color:var(--accent)}
.nav-num small{font-size:.4em;font-weight:700}
.nav-go{font-weight:700;font-size:14px;color:var(--accent);text-align:right}

.bar{height:8px;border-radius:4px;background:var(--inset);overflow:hidden;display:flex;min-width:60px;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--success)}
.bar.thin{height:6px}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:18px}
.card{background:var(--card-bg);backdrop-filter:var(--blur);border:1px solid var(--border);border-inline-start:6px solid var(--accent,var(--sh));border-radius:16px;padding:18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-line);padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.warn{background:var(--warning-bg);color:var(--warning);border-color:transparent}
.rev-chip{font-size:12px;color:var(--text-muted);font-weight:500}
.villa-title{font-size:18px;font-weight:700}
.card-pct{font-size:30px;font-weight:800;line-height:1}
.card-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;font-size:12px;color:var(--text-muted);gap:8px}
.open-tag{font-size:13px;color:var(--primary);font-weight:600;white-space:nowrap}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--border);background:var(--card-bg);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;backdrop-filter:var(--blur)}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.an-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px} .an-h h3{font-size:17px;font-weight:800;margin:0}
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.an{background:var(--card-bg);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.an.wide{grid-column:1/-1}
.an h4{margin:0;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted)}
.an .big{font-size:34px;font-weight:800;line-height:1.05} .an .big small{font-size:14px;font-weight:600;color:var(--text-muted);margin-inline-start:4px}
.an .big.bad{color:var(--danger)} .an .big.good{color:var(--success)}
.an p{margin:0;font-size:12.5px;color:var(--text-muted);line-height:1.5} .an p b{color:var(--text-main)}
.an table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;margin-top:2px} .an th{font-size:11px;font-weight:600;color:var(--text-muted);text-align:left;padding:4px 0;border-bottom:1px solid var(--border);vertical-align:bottom}
.an td,.an th{overflow-wrap:anywhere} .an .w1{width:60px} .an .w2{width:66px} .an .w3{width:78px}
.an td{padding:5px 0;border-bottom:1px solid var(--border)} .an tr:last-child td{border-bottom:0} .an .r{text-align:right;padding-inline-start:8px} .an td.r{white-space:nowrap}
.vl{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--primary);cursor:pointer;text-align:left} .vl:hover{text-decoration:underline}
.vchips{display:flex;flex-wrap:wrap;gap:6px} .vchips .vl{background:var(--inset);border:1px solid var(--border);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:600}
.an .nw{white-space:nowrap} .an details{font-size:12.5px} .an details>summary{cursor:pointer;color:var(--primary);font-weight:600;padding:4px 0}
.an .w4{width:92px} .an .w5{width:120px} .an .w6{width:170px} .an td .bar{min-width:0}
.stt{width:100%;border-collapse:collapse;font-size:12.5px} .stt th{font-size:11px;font-weight:600;color:var(--text-muted);text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--border);white-space:nowrap} .stt td{padding:6px 10px 6px 0;border-bottom:1px solid var(--border)} .stt tr:last-child td{border-bottom:0} .stt .r{text-align:right}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;margin-bottom:16px}
.hl .kpi b{font-size:28px} .hl .kpi b small{font-size:13px;font-weight:600;color:var(--text-muted);margin-inline-start:4px} .hl .kpi b.bad{color:var(--danger)}
.band{display:grid;grid-template-columns:86px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12.5px} .band .bar{min-width:0}
.agebar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--inset)} .agebar i{display:block;height:100%}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-muted)} .lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:5px}
.wk{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px} .wk>div{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;min-width:0}
.wk i{display:block;width:42%;max-width:16px;min-height:2px;border-radius:4px 4px 0 0}
.wkx{display:flex;gap:6px;font-size:10.5px;color:var(--text-muted)} .wkx span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;min-width:0}
@media (max-width:640px){.wkx span{overflow:visible;text-align:left}.an table.wt{table-layout:auto}.an table.wt th{width:auto}.wkx span:nth-child(even){visibility:hidden}.an table.wt th:nth-child(-n+4):not(:first-child),.an table.wt td:nth-child(-n+4):not(:first-child){display:none}}
.note-line{font-size:13px;color:var(--text-muted);max-width:90ch}
.banner{background:var(--warning-bg);color:var(--warning);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:500}

.sheet{background:var(--card-bg);backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow)}
.sh-head{display:flex;flex-wrap:wrap;gap:16px 32px;justify-content:space-between;align-items:flex-end}
.sh-head h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font-size:13px;color:var(--text-muted);align-items:center}
.score{min-width:min(280px,100%);flex:0 1 340px;display:flex;flex-direction:column;gap:6px}
.score .big{font-size:52px;font-weight:800;line-height:1;color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--inset);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.kpi b{display:block;font-size:22px;line-height:1.2} .kpi span{color:var(--text-muted);font-size:12px}

details.div{border:1px solid var(--border);border-radius:14px;overflow:hidden}
details.div>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(70px,140px) 52px;gap:12px;align-items:center;padding:12px 16px;background:var(--inset);font-weight:700}
details.div>summary::-webkit-details-marker{display:none}
details.div>summary .dn{min-width:0;display:flex;gap:8px;align-items:baseline}
details.div>summary .dn::before{content:"▸";color:var(--text-muted);font-size:12px}
details.div[open]>summary .dn::before{content:"▾"}
.wt{font-size:12px;color:var(--text-muted);font-weight:500;white-space:nowrap}
.sec{padding:14px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.sec h4{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.line{display:grid;grid-template-columns:38px minmax(0,1fr) 90px 62px 150px;gap:6px 12px;align-items:center;padding:6px 0;border-top:1px dashed var(--border);font-size:14px}
.line:first-of-type{border-top:none}
.line .no{color:var(--text-muted)} .line .qty,.line .w{text-align:right;white-space:nowrap}
.line .qty{color:var(--text-muted);font-size:13px} .line .w{font-weight:600}
.line .st{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.est{font-size:11px;color:var(--warning);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.B{background:var(--success-bg);color:var(--success)} .pill.C{background:var(--warning-bg);color:var(--warning)} .pill.D{background:var(--danger-bg);color:var(--danger)}
.pill.O{background:var(--primary-soft);color:var(--primary)} .pill.N{background:var(--inset);color:var(--text-muted)}
.steps{direction:ltr;display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.steps button{border:none;background:transparent;padding:3px 0;width:29px;font-size:11px;font-weight:600;cursor:pointer;color:var(--text-muted);border-inline-start:1px solid var(--border)}
.steps button:first-child{border-inline-start:none}
.steps button[aria-pressed="true"]{background:var(--success);color:var(--on-primary)}
.acts{background:var(--inset);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.acts h5{margin:0 0 4px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:6px 0;border-top:1px dashed var(--border);font-size:13px}
.cp .nm{min-width:0} .cp .nm small{color:var(--text-muted)}
.cp .res{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cir{font-family:var(--mono);font-size:12px;color:var(--text-muted)}
.tg{border:1px solid var(--border);background:var(--card-bg);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;min-width:74px;direction:ltr}
.tg .knob{width:16px;height:16px;border-radius:50%;background:var(--idle)}
.tg[aria-checked="true"]{background:var(--success-bg);color:var(--success);border-color:transparent} .tg[aria-checked="true"] .knob{background:var(--success)}
.chg{font-size:11px;color:var(--warning);font-weight:600}
.hist{grid-column:2/-1;display:flex;gap:4px 10px;flex-wrap:wrap;color:var(--text-muted);font-size:12px}
textarea.note{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;background:var(--card-bg);padding:12px 14px;resize:vertical;outline:none}
textarea.note:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.xlist{font-size:13px;color:var(--text-muted);display:flex;flex-direction:column;gap:4px}
.empty-state{text-align:center;padding:48px 16px;background:var(--card-bg);border-radius:16px;border:1px dashed var(--border)}
.empty-state h3{margin:0 0 8px;font-size:18px} .empty-state p{margin:0;color:var(--text-muted);font-size:14px}

footer{background:var(--foot-bg);color:var(--foot-ink);border-radius:16px;padding:10px 30px;border:1px solid var(--border);backdrop-filter:var(--blur);margin-top:20px}
.footer-content{padding:26px 0 18px;text-align:center}
.footer-content h3{margin:0 0 15px;position:relative;padding-bottom:10px;font-size:1.2rem;display:inline-block}
.footer-content h3::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:50px;height:3px;background:var(--primary);border-radius:2px}
.footer-links{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;align-items:center;font-size:14px}
.footer-links a{color:var(--foot-muted);text-decoration:none;display:inline-flex;align-items:center;gap:8px}.footer-links a:hover{color:var(--primary)}
.copyright{text-align:center;padding:15px;border-top:1px solid rgba(255,255,255,.1);color:var(--foot-muted);font-size:.9rem}
.signature{text-align:center;padding-bottom:12px;font-family:'Caveat',cursive;font-size:1.3rem;opacity:.9}

@media (max-width:720px){
  body{padding-block:14px 24px}
  .search-box,.search-box input{width:100%}
  .sheet{padding:16px}
  .line{grid-template-columns:34px minmax(0,1fr) auto}
  .line .qty{grid-column:2;text-align:left} .line .w{grid-column:3;grid-row:1} .line .st{grid-column:2/-1;justify-content:flex-start}
  details.div>summary{grid-template-columns:minmax(0,1fr) 52px} details.div>summary .wt,details.div>summary .bar{display:none}
  .cp{grid-template-columns:auto minmax(0,1fr)} .cp .res{grid-column:1/-1;justify-content:flex-start}
  .nav-num{font-size:48px}
}
.line.off .dsc{text-decoration:line-through;color:var(--text-muted)} .line.off .w{color:var(--text-muted)}
#printRoot{display:none}
.pdflink{background:var(--primary);color:var(--on-primary);border-color:var(--primary);text-decoration:none;display:inline-block}
@page{size:A4;margin:16mm 14mm 18mm}
@media print{html,body{background:#fff!important;color:#0f172a!important;padding:0!important;margin:0!important;min-height:0!important}.wrap{display:none!important}#printRoot{display:block;padding:0 4mm}}
</style>


<style id="shk-theme">
/* Shaker Inspect: Blue + Gold over the tracker's own colours */
:root[data-theme="light"], :root:not([data-theme]) { --primary:#0b2a5b; --primary-hover:#1b4a9e; --primary-soft:#e8eefb; --primary-line:#b9c8ea; --bg:#f6f5ef; --on-primary:#ffffff; --foot-bg:#0b2a5b; }
:root[data-theme="dark"] { --primary:#ffc61a; --primary-hover:#ffd75e; --primary-soft:rgba(255,198,26,.14); --primary-line:rgba(255,198,26,.4);
  --bg:#06142b; --bg-glow:radial-gradient(900px 480px at 100% 0%, rgba(245,184,0,.16), transparent 60%); --card-bg:#0d2247; --inset:#132b57; --text-main:#f4f1e6; --text-muted:#9fb0cf; --border:#1d3769; --on-primary:#0b2a5b; --foot-bg:#0d2247; --lift:0 24px 54px -22px rgba(245,184,0,.45); }
.embed .shk-back { margin-top: 0; }
.shk-back { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; margin: 0 -16px 12px; padding: 10px 16px; background: #0b2a5b; color: #fff; text-decoration: none; font: 700 15px var(--font); }
.shk-back b { color: #ffc61a; } .shk-back span { margin-left: auto; font: 600 12px var(--font); opacity: .85; padding: 3px 10px; border: 1px solid rgba(255,255,255,.4); border-radius: 99px; }
</style>
</head>
<body>
<a class="shk-back" href="./" id="shkBack"><b>‹</b> Shaker Inspect · Handover <span id="shkRoleTag"></span></a>
<div class="wrap" id="app" lang="en">
  <div class="header-bar">
    <div class="header-title">
      <h1 id="hTitle"></h1>
      <p id="hSub"></p>
    </div>
    <div class="header-tools">
      <div class="seg" id="themeSwitch" role="group" aria-label="Theme"><button type="button" data-th="light">Classic</button><button type="button" data-th="dark">Command</button></div>
      <div class="search-box"><input type="search" id="searchInput" aria-label="Search"></div>
      <div class="badge-counter"><span class="dot" id="dot"></span><span id="savetxt"></span></div>
    </div>
  </div>
  <nav id="crumbs" class="crumbs" hidden></nav>
  <main id="stage"></main>
  <footer>
    <div class="footer-content"><div>
      <h3>Tech Support</h3>
      <ul class="footer-links">
        <li><a href="mailto:architectahmedgaber@gmail.com"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 8.2L4.5 7.5v1.9l7.5 5.6 7.5-5.6V7.5z"/></svg>Email Us</a></li>
        <li><a href="https://wa.me/201018484400" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.7 14.9L2 22l5.3-1.4A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 1 1-4.3 15.2l-.4-.2-2.8.7.8-2.7-.3-.4A8.2 8.2 0 0 1 12 3.8z"/><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M8.8 8.4c.2 3.6 3.2 6.6 6.8 6.8"/></svg>WhatsApp</a></li>
      </ul>
    </div></div>

</div>
<div id="printRoot"></div>
<script>
function boot(D){
const IDS=Object.keys(D.V).sort((a,b)=>D.V[a].co.localeCompare(D.V[b].co)||D.V[a].n-D.V[b].n);
const STG=D.model.stages, LOC=D.model.locs, ACT=D.model.acts;
const SEEN={};Object.keys(D.V).forEach(id=>Object.keys(D.V[id].c).forEach(k=>{const p=k.split('|');SEEN[D.V[id].co+'|'+p[0]+'|'+p[2]]=1}));
const slug=s=>s.replace(/[^A-Za-z0-9]+/g,'_');
const NOCAT={s:[],est:1};
const cat=id=>D.T[D.V[id].t]||D.T.GEN||NOCAT;
const isGen=id=>!D.T[D.V[id].t];
D.ex=D.ex||{};
// weight of a line = its amount as a share of the villa's (or type's) total, after cancellations and quantity overrides
const exOf=(id,sec,l)=>(id&&D.ex[id]&&D.ex[id][sec.c+'|'+l.no])||null;
function amt(id,sec,l){const e=exOf(id,sec,l);if(l.off||(e&&e.c))return 0;if(e&&e.q!=null&&l.r)return e.q*l.r;return l.v}
const totCache=new Map();
function tot(id,C){const k=id||C;if(!totCache.has(k)){let t=0;C.s.forEach(sec=>sec.l.forEach(l=>{t+=amt(id,sec,l)}));totCache.set(k,t||1)}return totCache.get(k)}
const dead=(id,sec,l)=>{const e=exOf(id,sec,l);return !!(l.off||(e&&e.c))};
// Item_Weights tab: one weight per tracker item, shared equally among the live BOQ lines of that item. Lines with no tracker item are listed but not counted.
// Without the tab the old BOQ-amount weights are used.
const IW=(D.IW||{}).ARC||{},SWT=(D.IW||{}).STR||{},USE_IW=Object.keys(IW).length>0,USE_SW=Object.keys(SWT).length>0;
const iwCache=new Map();
function iwOf(id,C){const k=id||C;if(!iwCache.has(k)){const n={};let t=0;C.s.forEach(sec=>sec.l.forEach(l=>{if(l.a&&IW[l.a]>0&&!dead(id,sec,l))n[l.a]=(n[l.a]||0)+1}));Object.keys(n).forEach(a=>{t+=IW[a]});iwCache.set(k,{n,t:t||1})}return iwCache.get(k)}
const W=(id,C,sec,l)=>{if(!USE_IW)return amt(id,sec,l)/tot(id,C)*100;if(!l.a||!(IW[l.a]>0)||dead(id,sec,l))return 0;const o=iwOf(id,C);return IW[l.a]/o.n[l.a]/o.t*100};
const GEN_NOTE=USE_IW?'No BOQ was supplied for this type, so its list of lines is provisional (taken from types T01 to T06). The item weights are the same for every type.':'No BOQ was supplied for this type, so its weights are provisional: the average share per section across types T01 to T06. They should be replaced once the BOQ for this type is available.';
const W_NOTE=USE_IW?'Weight = the weight of the tracker item (1 to 3, Item_Weights tab) as a share of the villa total, split equally among the BOQ lines of that item. Lines with no tracker item are listed for reference and are not counted.':'Weight = BOQ quantity × an estimated unit rate, expressed as a share of the type total. The rates are estimates, so only the ratios between items carry meaning.';

// ---------- state (manual updates + notes), saved to the Site_State tab
let state=D.state||{}, online=true, pin='';
function vs(id){return state[id]||(state[id]={o:{},note:''})}
function setStatus(on,msg){online=on;document.getElementById('dot').className='dot'+(on?' on':'');document.getElementById('savetxt').textContent=(msg||(on?'Changes save to the sheet':'Not saved'))+' · ACC data as of '+(D.asof||'-')}
function save(id){cache={};
 if(window.SHK_ROLE!=='Admin'){setStatus(false,'View only: only admins can update');return}
 if(D.pin&&!pin){pin=window.prompt('Enter the edit PIN to save site updates')||'';if(!pin){setStatus(false,'Not saved: PIN needed');return}}
 setStatus(true,'Saving…');
 google.script.run.withSuccessHandler(r=>{if(r&&r.ok)setStatus(true);else{pin='';setStatus(false,'Not saved: wrong PIN')}})
  .withFailureHandler(()=>setStatus(false,'Could not save to the sheet')).saveVilla(id,vs(id).o,vs(id).note||'',pin)}

// ---------- progress maths
let cache={};
function cps(id,a){
 const A=ACT[a],c=D.V[id].c,order=Object.keys(A.st),has=(st,l)=>c[a+'|'+st+'|'+l];
 const keys=Object.keys(c).filter(k=>k.startsWith(a+'|'));
 let locs=A.locs.filter(x=>!x[3]||keys.some(k=>k.endsWith('|'+x[0]))||(x[3]===2&&SEEN[D.V[id].co+'|'+a+'|'+x[0]]));
 if(!locs.length)locs=A.locs.filter(x=>x[3]===2);
 const lt=locs.reduce((n,x)=>n+x[1],0),out=[];
 locs.forEach(([l,w,base])=>{
  const sts=order.filter(s=>base==='*'||base.split(' ').includes(s)||has(s,l));
  const tot=sts.reduce((n,s)=>n+A.st[s],0);
  let later=false;const rows=[];
  for(let i=sts.length-1;i>=0;i--){const s=sts[i],h=has(s,l)||[],last=h[h.length-1];
   const ok=!!last&&(last[2]==='B'||last[2]==='A');
   const def=ok||later;if(ok)later=true;
   const key=slug(a+'|'+s+'|'+l),ov=vs(id).o[key];
   rows.unshift({key,a,s,l,share:w/lt*A.st[s]/tot,h,last,def,implied:!ok&&def,done:ov===undefined?def:ov>=100,ov})}
  out.push(...rows)});
 return out}
function lineKey(sec,l){return slug('L|'+sec.c+'|'+(l.a||l.no+'|'+l.d.slice(0,24)))}
function calc(id){
 if(cache[id])return cache[id];
 const C=cat(id),acts={},r={p:0,appr:0,cd:0,rev:0,nost:0,n:0,last:'',cirs:0,divs:{},secs:{},lines:{}};
 const c=D.V[id].c,seen=new Set();
 const tally=h=>{if(!seen.has(h[0]+'/'+h[3])){seen.add(h[0]+'/'+h[3]);r.cirs++}if(h[1]>r.last)r.last=h[1]};
 Object.keys(c).forEach(k=>c[k].forEach(tally));D.V[id].x.forEach(tally);
 const lastOf={};Object.keys(c).forEach(k=>c[k].forEach(h=>{lastOf[h[0]]=h}));D.V[id].x.forEach(h=>{lastOf[h[0]]=h});
 r.req={n:0,O:0,C:0,D:0,B:0};Object.keys(lastOf).forEach(k=>{const cd=lastOf[k][2]==='A'?'B':lastOf[k][2];r.req.n++;r.req[cd]=(r.req[cd]||0)+1});
 C.s.forEach(sec=>{let sw=0,sp=0;
  sec.l.forEach(l=>{let p;const w=W(id,C,sec,l),e=exOf(id,sec,l);
   if(l.a){if(!acts[l.a]){const list=cps(id,l.a);acts[l.a]={list,p:list.reduce((n,x)=>n+(x.done?x.share:0),0)};
     list.forEach(x=>{if(x.done)r.appr++;else if(x.last&&(x.last[2]==='C'||x.last[2]==='D'))r.cd++;else if(x.last&&x.last[2]==='O')r.rev++})}
    p=acts[l.a].p}
   else p=(vs(id).o[lineKey(sec,l)]||0)/100;
   if(e&&e.m!=null)p=e.m/100;
   r.lines[lineKey(sec,l)+'|'+l.no]=p;if(w>0){r.n++;if(p===0)r.nost++}
   sw+=w;sp+=w*p});
  r.secs[sec.c]={w:sw,p:sw?sp/sw:0};
  const d=r.divs[sec.dv]||(r.divs[sec.dv]={w:0,pw:0});d.w+=sw;d.pw+=sp;r.p+=sp});
 r.p=r.p/100;r.acts=acts;return cache[id]=r}
const pct=x=>Math.round(x*100);
const pct1=x=>(x>0&&x*100<10?(x*100).toFixed(1):String(Math.round(x*100)));
const avg=list=>list.length?list.reduce((n,id)=>n+calc(id).p,0)/list.length:0;

// ---------- navigation: Company > Type > Villa
const COLORS={SH:'var(--sh)',SQ:'var(--sq)',AT:'var(--at)'};
const COMPANIES=(D.companies||[]).map(c=>({key:c.key,label:c.label,color:COLORS[c.key]||'var(--idle)'}));
const TORDER=['T01','T02','T03','T04','T05','T06','S01A','S01B','S02A','S02B'];
const tname=ty=>ty==='?'?'Type not stated':ty==='*'?'All villas':ty;
const byCo=k=>IDS.filter(id=>D.V[id].co===k);
const byType=(k,ty)=>byCo(k).filter(id=>D.V[id].t===ty);
const co=k=>COMPANIES.find(c=>c.key===k);
let view={level:'home'},stack=[],q='',skipPop=false,openDivs={};

// ---------- structure (CIR_STR tab): stages per villa, shown on their own, never mixed into the architectural progress
const SS=D.S||{},SV=D.SV||{},SNM={},SKEYS=(D.SNAMES||[]).map(s=>{SNM[s[0]]=s[1];return s[0]});
const sv=id=>D.V[id]||SV[id];
const SIDS=IDS.concat(Object.keys(SV)).sort((a,b)=>sv(a).co.localeCompare(sv(b).co)||sv(a).n-sv(b).n);
const sByCo=k=>SIDS.filter(id=>sv(id).co===k);
const sneed=id=>{const l=(D.SN||{})[sv(id).t];return l&&l.length?l:SKEYS};
const sCache={},sw=k=>USE_SW?(SWT[k]||0):1;
function sprog(id){
 if(sCache[id])return sCache[id];
 const o=SS[id],need=sneed(id),r={p:0,ok:0,n:need.length,rev:0,cd:0,req:0,last:''};
 let wt=0,wok=0;need.forEach(k=>{wt+=sw(k)});
 if(o){need.forEach(k=>{const e=o.st[k];if(!e)return;if(e[5]){r.ok++;wok+=sw(k)}else if(e[3]==='O')r.rev++;else if(e[3]==='C'||e[3]==='D')r.cd++});
  Object.keys(o.st).forEach(k=>{const e=o.st[k];r.req+=e[0];if(e[2]>r.last)r.last=e[2]});r.req+=o.x;r.p=wt?wok/wt:0}
 return sCache[id]=r}
const savg=l=>l.length?l.reduce((n,id)=>n+sprog(id).p,0)/l.length:0;
let disc='ARC';try{if(localStorage.getItem('vhtDisc')==='STR')disc='STR'}catch(x){}
const S_NOTE='Structure progress = share of the structural stages of the villa type (PC foundations up to the upper roof slab, and the stairs) that have at least one approved request (code A or B) in ACC. Each stage counts by its weight in the Item_Weights tab (1 to 3). It is shown on its own and does not change the architectural progress.';
const discBar=()=>`<div class="toolbar noprint" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Discipline"><button type="button" data-disc="ARC" aria-pressed="${disc==='ARC'}">Architecture</button><button type="button" data-disc="STR" aria-pressed="${disc==='STR'}">Structure</button></div></div>`;
const EMB=document.documentElement.classList.contains('embed');
const rep=()=>{if(EMB)try{parent.postMessage({shk:'depth',n:stack.length},'*')}catch(e){}};
function go(v){stack.push(view);view=v;if(!EMB)try{history.pushState({d:stack.length},'')}catch(e){}render();window.scrollTo({top:0});rep()}
function pop(){if(stack.length){view=stack.pop();render();window.scrollTo({top:0});rep()}}
function back(){if(!stack.length)return;if(EMB){pop();return}try{history.back()}catch(e){pop()}}
function jump(i){const n=stack.length-i;view=stack[i];stack=stack.slice(0,i);if(EMB){render();window.scrollTo({top:0});rep();return}try{skipPop=true;history.go(-n)}catch(x){skipPop=false}render();window.scrollTo({top:0})}
window.addEventListener('message',e=>{if(EMB&&e.source===parent&&e.data&&e.data.shk==='back')pop()});
const onPop=()=>{if(skipPop){skipPop=false;return}pop()};
window.addEventListener('popstate',onPop);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bar=(p,cls)=>`<div class="bar ${cls||''}"><i style="width:${Math.min(100,p*100).toFixed(1)}%"></i></div>`;
const RESP={B:'B · Approved',A:'A · Approved',C:'C · Revise and resubmit',D:'D · Rejected',O:'In review',N:'No request'};

function crumbs(){
 const nav=document.getElementById('crumbs');
 if(view.level==='home'&&!q){nav.hidden=true;nav.innerHTML='';return}
 nav.hidden=false;
 const tr=[['Home','home']];
 if(q)tr.push(['Search results']);
 else{tr.push([co(view.co).label,view.level==='co'?null:'co']);
  if(view.ty)tr.push([tname(view.ty),view.level==='type'?null:'type']);
  if(view.level==='weights')tr.push(['Weights table']);
  if(view.level==='villa')tr.push(['Villa '+sv(view.id).n])}
 let h=q?'':'<button type="button" class="back-btn" data-nav="back">← Back</button>';
 tr.forEach((c,i)=>{if(i)h+='<span class="sep">›</span>';h+=c[1]?`<button type="button" data-nav="${c[1]}">${esc(c[0])}</button>`:`<span class="here">${esc(c[0])}</span>`});
 nav.innerHTML=h}

function tile(name,sub,num,color,goTxt,attr,empty){
 return `<button type="button" class="nav-tile${empty?' empty':''}" style="--accent:${color}" ${empty?'disabled':attr}><div><div class="nav-name">${esc(name)}</div><div class="nav-sub">${sub}</div></div><div class="nav-num num">${num}</div><div class="nav-go">${empty?'':goTxt+' →'}</div></button>`}
function villaCard(id,showCo){
 const r=calc(id),V=D.V[id],c=co(V.co);
 return `<button type="button" class="card" data-villa="${id}" style="--accent:${c.color}">
  <div class="card-top"><span class="chip${V.t==='?'?' warn':''}">${esc(V.tn)}</span><span class="rev-chip num">${r.cirs} CIRs</span></div>
  <div class="villa-title">Villa <span class="num">${V.n}</span>${V.s.length?` <span class="rev-chip">with ${V.s.join(', ')}</span>`:''}${showCo?` <span class="rev-chip">· ${c.label}</span>`:''}</div>
  <div class="card-pct num">${pct1(r.p)}%</div>${bar(r.p)}
  <div class="card-footer"><span>${r.cd?`<span class="pill C">${r.cd} to resubmit</span> `:''}${r.rev?`<span class="pill O">${r.rev} in review</span>`:''}${!r.cd&&!r.rev?`Last request <span class="num">${r.last||'-'}</span>`:''}</span><span class="open-tag">Open →</span></div></button>`}

// ---------- request analytics, straight from the ACC export
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dm=d=>d?(+d.slice(8,10))+' '+MON[+d.slice(5,7)-1]:'-';
const one=x=>(Math.round(x*10)/10).toFixed(1);
const share=(a,b)=>b?one(a/b*100)+'%':'-';
function analytics(key,title,src,names){
 const SRC=src||D.stats||{},S=SRC[key];if(!S||!S.n)return '';
 const T=S.turn,rej=S.C+S.D,re=S.rev[1]+S.rev[2]+S.rev[3],ref=SRC.ref;
 const ageT=S.age[0]+S.age[1]+S.age[2],ageC=['var(--success)','var(--warning)','var(--danger)'];
 const wmax=Math.max(1,...S.weeks.map(w=>Math.max(w[1],w[2])));
 const actName=a=>names?(names[a]||'Not linked to a stage'):ACT[a]?ACT[a].n:'Not linked to a BOQ activity';
 const acts=S.acts.slice().sort((a,b)=>(b[2]+b[3])-(a[2]+a[3])).filter(a=>a[2]+a[3]>0).slice(0,6);
 return `<div class="an-h"><h3>${esc(title)}</h3><span class="note-line">From the ACC export · ${S.n} requests · figures as of <b class="num">${fmtDate(ref)}</b></span></div>
 <div class="an-grid">
  <section class="an"><h4>Review turnaround</h4><div class="big num">${T.n?one(T.avg):'-'}<small>days on average</small></div>
   <p>Sent for review to response, calendar days, on <b class="num">${T.n}</b> answered requests. Median <b class="num">${one(T.med)}</b> · within 3 days <b class="num">${share(T.in3,T.n)}</b> · longest <b class="num">${T.max}</b> days.</p>
   ${S.months.length?`<table><tr><th>Month of response</th><th class="r w2">Answered</th><th class="r w3">Average days</th></tr>${S.months.map(m=>`<tr><td>${MON[+m[0].slice(5)-1]} ${m[0].slice(0,4)}</td><td class="r num">${m[1]}</td><td class="r num">${one(m[2])}</td></tr>`).join('')}</table>`:''}</section>
  <section class="an"><h4>Overdue requests</h4><div class="big num ${S.overdue?'bad':'good'}">${S.overdue}<small>of ${S.open} open</small></div>
   <p>Open requests past their ACC due date ("Ball in court due date") on the export date.${S.open?` Due within 3 days <b class="num">${S.soon}</b> · earliest due date <b class="num">${S.nextDue?fmtDate(S.nextDue):'-'}</b>.`:''}${S.noDue?` <b class="num">${S.noDue}</b> open requests carry no due date.`:''}</p>
   <h4 style="margin-top:8px">Age of open requests</h4>
   ${ageT?`<div class="agebar">${S.age.map((n,i)=>`<i style="width:${n/ageT*100}%;background:${ageC[i]}"></i>`).join('')}</div>
   <div class="lg"><span><i style="background:${ageC[0]}"></i>0–3 days <b class="num">${S.age[0]}</b></span><span><i style="background:${ageC[1]}"></i>4–7 days <b class="num">${S.age[1]}</b></span><span><i style="background:${ageC[2]}"></i>over 7 days <b class="num">${S.age[2]}</b></span></div>
   <p>Days since the request was sent for review. Oldest open request: <b class="num">${S.oldest}</b> days.</p>`:'<p>No open requests.</p>'}</section>
  <section class="an"><h4>Rejection rate</h4><div class="big num">${share(rej,S.resp)}<small>code C or D</small></div>
   <p><b class="num">${rej}</b> of <b class="num">${S.resp}</b> answered requests · code C <b class="num">${S.C}</b> · code D <b class="num">${S.D}</b>.</p>
   ${acts.length?`<table><tr><th>${names?'Stage':'Activity'}</th><th class="r w2">Answered</th><th class="r w2">C / D</th><th class="r w1">Rate</th></tr>${acts.map(a=>`<tr><td>${esc(actName(a[0]))}</td><td class="r num">${a[1]}</td><td class="r num">${a[2]} / ${a[3]}</td><td class="r num">${share(a[2]+a[3],a[1])}</td></tr>`).join('')}</table>`:''}</section>
  <section class="an"><h4>Resubmissions</h4><div class="big num">${re}<small>${share(re,S.n)} of all requests</small></div>
   <p>Requests whose current revision in ACC is 1 or higher.</p>
   <table><tr><th>Current revision</th><th class="r w2">Requests</th></tr>${['Revision 0 (first submission)','Revision 1','Revision 2','Revision 3 or higher'].map((t,i)=>S.rev[i]||i<2?`<tr><td>${t}</td><td class="r num">${S.rev[i]}</td></tr>`:'').join('')}</table>
   <h4 style="margin-top:8px">Ball in court</h4>

function barPng(p){
 try{const W=336,H=32,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const pill=(w,col)=>{const r=H/2;g.fillStyle=col;g.beginPath();g.moveTo(r,0);g.lineTo(w-r,0);g.arc(w-r,r,r,-Math.PI/2,Math.PI/2);g.lineTo(r,H);g.arc(r,r,r,Math.PI/2,Math.PI*1.5);g.closePath();g.fill()};
  pill(W,'#e2e8f0');p=Math.max(0,Math.min(1,p||0));if(p>0)pill(Math.max(H,Math.round(W*p)),'#059669');
  return c.toDataURL('image/png').split(',')[1]||''}catch(e){return ''}}

 return {file:`Villa ${V.n} - ${c.label} - Handover Status Report`,project:'SOUTHMED NORTH COAST  ·  '+c.label.toUpperCase(),villa:V.n,company:c.label,
  villaLabel:String(V.n)+(V.s.length?' (with '+V.s.join(', ')+')':''),type:V.tn,last:fmtDate(r.last),printed:today,asof:fmtDate(D.asof),
  pct:pct1(r.p)+'%',p:r.p,pImg:barPng(r.p),kpi:[String(r.appr),r.cd+' / '+r.rev,r.nost+' of '+r.n],
  gen:isGen(id)?(V.t==='?'?'The request titles for this villa do not state its type. ':'')+GEN_NOTE:'',wnote:W_NOTE,
  divs:divs.map(dv=>{const d=r.divs[dv],p=d.w?d.pw/d.w:0;return [dv,D.DIVN[dv]||'',d.w.toFixed(1)+'%',pct(p)+'%',d.pw.toFixed(1)+'%',p,barPng(p)]}),
  open,
  stages:Object.keys(ACT).filter(a=>r.acts[a]&&r.acts[a].list.some(x=>x.h.length||x.ov!==undefined)).map(a=>({name:ACT[a].n,p:pct(r.acts[a].p)+'%',rows:r.acts[a].list.map(cp)})),
  boq:divs.map(dv=>{const d=r.divs[dv],p=d.w?d.pw/d.w:0;return {dv,name:D.DIVN[dv]||'',w:d.w.toFixed(1)+'%',p:pct(p)+'%',
   secs:C.s.filter(s=>s.dv===dv).map(sec=>({code:sec.c.replace(/(\d\d)(\d\d)(\d\d)/,'$1 $2 $3'),name:sec.n,w:r.secs[sec.c].w.toFixed(2)+'%',p:pct(r.secs[sec.c].p)+'%',
    lines:sec.l.map(l=>{const e=exOf(id,sec,l),gone=dead(id,sec,l),qv=e&&e.q!=null?e.q:l.q;
     return [l.no,l.d+(l.e?' (estimated, not in BOQ)':'')+(e&&e.why?' ('+e.why+')':''),qv==null?'':qv+' '+l.u,W(id,C,sec,l).toFixed(2)+'%',gone?'Cancelled':pct(r.lines[lineKey(sec,l)+'|'+l.no]||0)+'%',gone?1:0]})}))}}),
  other:V.x.map(h=>[h[0],fmtDate(h[1]),h[2]==='O'?'In review':h[2],h[4]]),note:vs(id).note||''}}
let pdfUrl=null;
function makePdf(btn){
 const box=document.getElementById('pdfBox');btn.disabled=true;box.innerHTML='<span class="note-line">Preparing the PDF, up to a minute…</span>';
 google.script.run.withSuccessHandler(res=>{btn.disabled=false;
   if(!res||!res.ok||!res.b64){box.innerHTML='<span class="note-line">The PDF could not be made.</span>';return}
   const bin=atob(res.b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
   if(pdfUrl)URL.revokeObjectURL(pdfUrl);
   pdfUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
   box.innerHTML=(res.url?`<a class="btn pdflink" href="${res.url}" target="_blank" rel="noopener">Open PDF</a> `:'')+`<a class="btn" id="pdfLink" href="${pdfUrl}" download="${esc(res.name)}">Download</a>`;
   if(!res.url){try{document.getElementById('pdfLink').click()}catch(x){}}})
  .withFailureHandler(e=>{btn.disabled=false;box.innerHTML='<span class="note-line">The PDF could not be made: '+esc((e&&e.message)||e)+'</span>'})
  .makePdf(reportModel(view.id))}
function reportDoc(id){
 const V=D.V[id];
 return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Villa ${V.n} Handover Status Report - ${esc(co(V.co).label)}</title>
 <link href="fonts/fonts.css" rel="stylesheet">
 <style>${REPORT_CSS}
 html,body{margin:0;background:#e2e8f0}
 .bar{position:sticky;top:0;background:#0f172a;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;font:14px Inter,Arial,sans-serif;z-index:5}
 .bar button{font:600 14px Inter,Arial,sans-serif;background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
 .sheet{background:#fff;width:210mm;max-width:100%;margin:18px auto;padding:16mm 14mm;box-shadow:0 8px 30px rgba(15,23,42,.18)}
 @media print{html,body{background:#fff}.bar{display:none}.sheet{width:auto;margin:0;padding:0;box-shadow:none}}
 </style></head><body><div class="bar"><span>In the print window choose A4, and turn on Background graphics so the colours print.</span><button onclick="window.print()">Print / save as PDF</button></div>
 <div class="sheet rep">${report(id)}</div></body></html>`}
function printReport(){
 if(view.level!=='villa')return;
 let w=null;try{w=window.open('','_blank')}catch(e){}
 if(w&&w.document){w.document.open();w.document.write(reportDoc(view.id));w.document.close();return}
 fillReport();window.print();   // pop-up blocked: print inside this page instead
}
function fillReport(){const el=document.getElementById('printRoot');
 el.innerHTML=(view.level==='villa'&&!q)?`<style>${REPORT_CSS}</style><div class="rep">${report(view.id)}</div>`:''}
const onBeforePrint=()=>fillReport();
window.addEventListener('beforeprint',onBeforePrint);

function render(anim){
 setStatus(online);
 const st=document.getElementById('stage');
 const a=document.activeElement&&document.activeElement.id,sel=document.activeElement&&document.activeElement.selectionStart;
 const S=disc==='STR';
 st.innerHTML=q?discBar()+vSearch():view.level==='home'?discBar()+(S?vHomeS():vHome()):view.level==='co'?discBar()+(S?vCoS():vCo()):view.level==='type'?vType():view.level==='weights'?vWeights():D.V[view.id]?vVilla():vSVilla();
 if(anim!==false){st.classList.remove('stage-in');void st.offsetWidth;st.classList.add('stage-in')}
 crumbs();
 if(a&&a!=='searchInput'&&document.getElementById(a)){const e=document.getElementById(a);e.focus();try{e.setSelectionRange(sel,sel)}catch(x){}}}
function soft(){const y=window.scrollY;render(false);window.scrollTo({top:y})}

function csv(){
 const out=['Company,Villa,Type,Villa progress %,Division,Section,Item,Description,Unit,Quantity,Weight %,Item progress %'];
 byCo(view.co).forEach(id=>{const r=calc(id),C=cat(id),V=D.V[id];C.s.forEach(sec=>sec.l.forEach(l=>{
  out.push([co(V.co).label,V.n,V.tn,(r.p*100).toFixed(1),sec.dv+' '+D.DIVN[sec.dv],sec.c+' '+sec.n,l.no,l.d,l.u,l.q==null?'':l.q,W(id,C,sec,l).toFixed(3),pct(r.lines[lineKey(sec,l)+'|'+l.no])].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(','))}))});
 return '﻿'+out.join('\n')}
function clearSearch(){q='';document.getElementById('searchInput').value=''}

const onClick=async e=>{
 if(EMB&&e.target.closest('#shkBack')){e.preventDefault();if(stack.length)pop();else parent.postMessage({shk:'exit'},'*');return}
 const el=e.target.closest('[data-nav],[data-disc],[data-co],[data-type],[data-villa],[data-weights],[data-cp],[data-step],[data-th],#csv,#pdfBtn,#reloadBtn');if(!el)return;
 const d=el.dataset;
 if(d.th){setTheme(d.th);return}
 if(d.disc){disc=d.disc;try{localStorage.setItem('vhtDisc',disc)}catch(x){}render();return}
 if(d.nav==='back'){back();return}
 if(d.nav==='home'){clearSearch();if(stack.length)jump(0);else{view={level:'home'};render()}return}
 if(d.nav==='co'||d.nav==='type'){const i=stack.findIndex(s=>s.level===d.nav);if(i>=0)jump(i);return}
 if(d.co){go({level:'co',co:d.co});return}
 if(d.type){go({level:'type',co:view.co,ty:d.type});return}
 if(d.weights){go({level:'weights',co:view.co,ty:view.ty});return}
 if(d.villa){const id=d.villa,V=sv(id);openDivs={};
  if(q){clearSearch();if(stack.length){view=stack[0];stack=[]}else view={level:'home'};go({level:'co',co:V.co});if(disc!=='STR')go({level:'type',co:V.co,ty:V.t})}
  go({level:'villa',co:V.co,ty:view.ty||(disc==='STR'?undefined:V.t),id});return}
 if(d.cp){const id=view.id,o=vs(id).o,nv=el.getAttribute('aria-checked')!=='true',def=d.def==='1';
  if(nv===def)delete o[d.cp];else o[d.cp]=nv?100:0;save(id);soft();return}
 if(d.step!==undefined){const id=view.id,o=vs(id).o,n=+d.step;if(n===0)delete o[d.k];else o[d.k]=n;save(id);soft();return}
 if(el.id==='csv'){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv());a.download='villa-handover-'+co(view.co).label+'.csv';document.body.appendChild(a);a.click();a.remove();return}
 if(el.id==='pdfBtn'){makePdf(el);return}
 if(el.id==='reloadBtn'){el.disabled=true;el.textContent='Reading the sheet…';google.script.run.withSuccessHandler(j=>{location.hash='';window.__reboot(j)}).withFailureHandler(()=>{el.disabled=false;el.textContent='Reload from sheet'}).getData(true);return}
};
document.addEventListener('click',onClick);
const onToggle=e=>{const d=e.target;if(d.dataset&&d.dataset.div)openDivs[d.dataset.div]=d.open};
document.addEventListener('toggle',onToggle,true);
let nt,stt;
const onInput=e=>{
 if(e.target.id==='searchInput'){clearTimeout(stt);stt=setTimeout(()=>{q=e.target.value.trim();render()},200);return}
 if(e.target.dataset&&e.target.dataset.note){const id=e.target.dataset.note;vs(id).note=e.target.value;clearTimeout(nt);nt=setTimeout(()=>save(id),1200)}
};
document.addEventListener('input',onInput);

function setTheme(th){document.documentElement.setAttribute('data-theme',th);try{localStorage.setItem('vht3Theme',th)}catch(x){}markTheme()}
function markTheme(){const a=document.documentElement.getAttribute('data-theme'),cur=a||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
 document.querySelectorAll('#themeSwitch button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===cur))}

// ---------- boot
document.getElementById('hTitle').textContent='Villa Handover Tracker';
document.getElementById('hSub').textContent='Pick a company, then a villa type, then a villa. Each villa carries every BOQ item of its type with a relative weight, and each item takes its status from the ACC inspection requests.';
document.getElementById('searchInput').placeholder='Search by villa number, type or company';
try{const th=localStorage.getItem('vht3Theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(x){}
markTheme();render();
return {destroy(){document.removeEventListener('click',onClick);document.removeEventListener('input',onInput);document.removeEventListener('toggle',onToggle,true);window.removeEventListener('popstate',onPop);window.removeEventListener('beforeprint',onBeforePrint)}};
}
let app=null;
window.__reboot=function(json){if(app)app.destroy();app=boot(JSON.parse(json))};
function fail(e){document.getElementById('stage').innerHTML='<div class="empty-state"><h3>Could not read the sheet</h3><p>'+String((e&&e.message)||e).replace(/[<&]/g,'')+'</p></div>'}
document.getElementById('stage').innerHTML='<div class="empty-state"><h3>Reading the sheet…</h3><p>Loading villas, BOQ items and inspection requests.</p></div>';
google.script.run.withSuccessHandler(window.__reboot).withFailureHandler(fail).getData(false);
</script>
